- url: https://github.com/ITUINT
  type: GitHubOrganization
  status: '200'
  note: >-
    Verified official ITU organization via the GitHub API (name "International Telecommunication
    Union", email itumail@itu.int). public_repos = 0.
- url: https://camaraproject.org/
  type: Reference
  status: '200'
  note: >-
    CAMARA participant listing checked for ITU. ITU is not named. CAMARA is a Linux Foundation
