- url: https://www.itu.int/en/ITU-T/publications/Pages/recs.aspx
  type: Documentation
  status: '200'
  note: ITU-T Recommendations — PDF documents, no machine-readable API artifacts.
actions:
  apisListed: 2
  openapiDirectoryCreated: false
  reason: >-
    Two real, live-confirmed APIs are listed. No OpenAPI exists to harvest, so the openapi/
    directory is intentionally omitted rather than populated with anything derived or invented.
