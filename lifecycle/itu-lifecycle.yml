- { url: 'https://api.datahub.itu.int/v2/idi/dashboard/version', status: 200, note: 'returns [2023,2024,2025,2026]' }
- { url: 'https://api.datahub.itu.int/v2/methodology/dataset', status: 200, note: source of the division contact emails }
- { url: 'https://www.itu.int/en/ITU-D/Technology/Pages/EmergingTechnologiesPages/api.aspx', status: 200, note: ITU calls the Proximity API a demonstration }
