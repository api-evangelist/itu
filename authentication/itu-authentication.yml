schemes:
- name: anonymous
  type: none
  description: >-
    The ITU DataHub API requires no credential of any kind. Confirmed 2026-07-26: HTTP 200 on
    /v2/country/all, /v2/region/all, /v2/dictionaries/getcategories, /v2/umc/topic/all,
    /v2/idi/dashboard/version and /v2/methodology/dataset with no API key, no Authorization header,
    no Referer and no Origin. The service returns `access-control-allow-origin: *` and an OPTIONS
    preflight advertising `access-control-allow-methods: OPTIONS,GET`, so it is callable directly
    from a browser.
  apis:
  - ITU DataHub API
  sources:
  - openapi/itu-datahub-openapi.yml
- name: functionKey
  type: apiKey
  in: query
  parameter: code
  description: >-
    Azure Functions function key on the ITU Proximity to Fibre Node API. ITU embeds a working key
    per route in its public web client at https://bbmaps.itu.int/web10km/, so the surface is
    effectively open — there is no registration, no self-service key issuance, no scope model and no
    documented rotation policy. A missing or invalid `code` returns HTTP 401 with an empty body
    (confirmed 2026-07-26).
  apis:
  - ITU Proximity to Fibre Node API
  sources:
  - openapi/itu-proximity-openapi.yml
