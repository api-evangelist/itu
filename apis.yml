name: ITU
kind: company
description: >-
  The International Telecommunication Union (ITU) is the United Nations specialized agency for
  information and communication technologies, headquartered in Geneva and made up of 194 Member
  States plus roughly 1,000 sector members. It sits at the top of the global telecom value chain
  rather than inside it: ITU-R allocates the global radio spectrum and manages the master
  international frequency register and satellite filings, ITU-T publishes the Recommendations that
  define interoperable telecom networks, and ITU-D collects and publishes the world's reference ICT
  statistics. Its market is Global by treaty. Its API posture is genuinely open but entirely
  undeclared: ITU operates real, anonymously callable HTTP APIs behind the DataHub statistics portal
  and behind an ITU-D "Proximity to Fibre Node" demonstration built on the ITU Broadband Maps, and
  neither requires a key, a login, or a partner agreement — but there is no developer portal, no
  api.itu.int, no published OpenAPI, no SDK, no terms of programmatic use, and the official ITU
  GitHub organization has zero public repositories. ITU is not a CAMARA participant and not a GSMA
  Open Gateway operator; network APIs are being standardised outside the UN system, and ITU's role
  in that layer is limited to the IMT requirements framework rather than any callable interface.
