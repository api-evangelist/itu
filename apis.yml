apis:
- aid: itu:itu-datahub-api
  name: ITU DataHub API
  description: >-
    The undocumented JSON API that serves the ITU DataHub (datahub.itu.int), ITU's official ICT
    statistics portal and the successor to ICT Eye. Confirmed anonymously callable on 2026-07-25 with
    no key, header, or referer required — /v2/country/all returns the full country reference list,
    /v2/region/all the ITU/BDT and UN M49 groupings, /v2/dictionaries/getcategories the full indicator
    dictionary, /v2/data/bycode/{codeID} the time series for an indicator, and /v2/idi/* and /v2/umc/*
    the ICT Development Index and Universal Meaningful Connectivity dashboards. ITU publishes no
    documentation, no OpenAPI, and no terms of programmatic use for this surface; the endpoint list
    was recovered from the DataHub client bundle, so it should be treated as an internal backend that
    happens to be public rather than as a supported product API.
  humanURL: https://datahub.itu.int/
  baseURL: https://api.datahub.itu.int/v2
