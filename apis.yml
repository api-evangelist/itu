- aid: itu:itu-proximity-to-fibre-node-api
  name: ITU Proximity to Fibre Node API
  description: >-
    An ITU-D Technology and Network Development API that scores a batch of coordinates against the ITU
    Interactive Transmission Map (Broadband Maps) fibre network data. Two routes are published on the
    ITU-D demonstration page — route-calcdistancetonode returns the proximity band to the nearest
    fibre node, and route-calc10kmintersection returns a within-10km flag. Both accept a POSTed
    text/csv body with X and Y columns and return a URL to a generated ZIP of results; both were
    confirmed returning HTTP 200 with real output on 2026-07-25. Access is by an Azure Functions
    function key passed as a ?code= query parameter that ITU embeds in the public web client, so it is
    effectively open; there is no signup, no OpenAPI, and no rate limit published.
  humanURL: https://www.itu.int/en/ITU-D/Technology/Pages/EmergingTechnologiesPages/api.aspx
  baseURL: https://bbmaps.itu.int/functionproximity
