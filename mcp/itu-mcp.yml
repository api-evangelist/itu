agent_notes:
- >-
  Resolve identity before data. Indicator codeIDs come from get_indicator_categories, ITU CountryIDs
  and ISO codes from list_countries, regionIDs from list_regions. The IDI and UMC country tools key
  on the numeric ITU CountryID, NOT the ISO code — mixing them silently returns an empty array.
- >-
  An empty array is ambiguous. It means either "no data" or "no such identifier"; the API does not
  distinguish. Always validate identifiers first.
- >-
  Prefer get_country_series over get_indicator_series. The unscoped series endpoint returns roughly
  1.1 MB with no pagination available.
- >-
  There are no published rate limits and no rate-limit headers. Self-throttle and cache; the
  reference data (countries, regions, topics, targets) changes rarely.
- >-
  Attribute results to ITU. This is UN reference statistics; cite the indicator label, the dataYear
  and the dataSource field, which names the reporting national regulator or marks the value an
  "ITU estimate.".
